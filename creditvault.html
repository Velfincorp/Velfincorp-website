<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
    // Centralized Authentication & Security Protection Script
    (function() {
        const currentPage = window.location.pathname.split("/").pop() || "index.html";
        const loggedUser = sessionStorage.getItem('velfincorp_logged_user');
        const userRole = sessionStorage.getItem('velfincorp_role');

        // 1. Prevent back/forward cache browsing after logout
        window.pageshow = function(event) {
            if (event.persisted || !sessionStorage.getItem('velfincorp_logged_user')) {
                window.location.replace('login.html');
            }
        };

        // 2. Public pages that don't require login
        const publicPages = ['index.html', 'login.html', 'contact.html', ''];
        if (publicPages.includes(currentPage)) {
            return; // Allow public access
        }

        // 3. If not logged in, redirect to login page immediately
        if (!loggedUser || !userRole) {
            window.location.replace('login.html');
            return;
        }

        // 4. Role-based Access Control (RBAC) Enforcement
        if (userRole === 'borrower') {
            // Borrowers are ONLY allowed inside the borrower portal
            if (currentPage !== 'borrower-portal.html') {
                window.location.replace('borrower-portal.html');
            }
        } else {
            // Admin and Staff are NOT allowed inside the borrower portal
            if (currentPage === 'borrower-portal.html') {
                window.location.replace('dashboard.html');
            }
        }
    })();
</script>

<html lang="ta">

            border-left-color: var(--gold);

        .sidebar-menu li a i {

        }
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .btn-logout {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: block;
            text-align: center;
            box-sizing: border-box;
        }

        /* Main Content Area */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
            box-sizing: border-box;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--white);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(15, 29, 54, 0.05);
            border-top: 5px solid var(--navy);
        }
        h2 {
            font-family: 'Cinzel', serif;
            text-align: center;
            color: var(--navy);
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 250px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--navy);
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
        }
        .btn-submit {
            background-color: var(--navy);
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            margin-top: 30px;
            transition: 0.3s;
        }
        .btn-submit:hover {
            background-color: var(--gold);
            color: var(--navy);
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Left Sidebar Navigation Menu -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <img src="velfincorp-logo.jpeg" alt="Logo" class="sidebar-logo">
            <div class="sidebar-title">VEL FIN CORP</div>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html"><i class="fas fa-home"></i> Main Dashboard</a></li>
            <li><a href="borrowers-details.html"><i class="fas fa-users"></i> Borrower Details</a></li>
            <li><a href="creditvault.html" class="active"><i class="fas fa-file-invoice-dollar"></i> Credit Vault Loan</a></li>
            <li><a href="personalloan.html"><i class="fas fa-hand-holding-usd"></i> Personal Loan</a></li>
            <li><a href="payments.html"><i class="fas fa-money-bill-wave"></i> Payment Collection</a></li>
            <li><a href="creditvault-report.html"><i class="fas fa-vault"></i> Credit Vault Report</a></li>
            <li><a href="personalloan-report.html"><i class="fas fa-chart-line"></i> Personal Loan Report</a></li>
            <li><a href="allpayments-report.html"><i class="fas fa-receipt"></i> All Payments Report</a></li>
            <li><a href="login.html"><i class="fas fa-key"></i> Access & Password</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="index.html" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container">
            <h2>VEL FIN CORP</h2>
            <div class="subtitle">Credit Vault - Product Loan Application</div>

            <form id="creditVaultForm" onsubmit="return validateCreditVault(event)">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Borrowers Details *</label>
                        <select id="Borrowers_Details" required>
                            <option value="">-Select Borrower-</option>
                            <option value="cust1">Ravichandran (VFC/001/2026)</option>
                            <option value="cust2">Thowlath Basha (VFC/002/2026)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Loan Type *</label>
                        <select id="Loan_Type" onchange="handleLoanTypeChange()" required>
                            <option value="">-Select-</option>
                            <option value="Mobile">Mobile</option>
                            <option value="Electrical">Electrical</option>
                            <option value="Furniture">Furniture</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Loan ID</label>
                        <input type="text" id="Loan_ID" readonly placeholder="Auto-generated (e.g., VML-001/2026)" style="background-color: #f1f5f9;">
                    </div>
                    <div class="form-group">
                        <label>Product Name *</label>
                        <input type="text" id="Product_Name" placeholder="Enter product name" required>
                    </div>
                </div>

                <!-- Conditional Fields for Mobile / Electrical / Furniture -->
                <div class="form-row hidden" id="mobileFields">
                    <div class="form-group">
                        <label>IMEI 1 *</label>
                        <input type="text" id="IMEI_1" placeholder="Enter IMEI 1">
                    </div>
                    <div class="form-group">
                        <label>IMEI 2 *</label>
                        <input type="text" id="IMEI_2" placeholder="Enter IMEI 2">
                    </div>
                </div>

                <div class="form-row hidden" id="serialField">
                    <div class="form-group">
                        <label>Serial No *</label>
                        <input type="text" id="Serial_No" placeholder="Enter Serial Number">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Product Value (₹) *</label>
                        <input type="number" id="Product_Value" oninput="calculateCreditVault()" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label>Standard Down Payment (30%)</label>
                        <input type="number" id="Standard_Down_Payment" readonly style="background-color: #f1f5f9;">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Customer Down Payment (₹) *</label>
                        <input type="number" id="Customer_Down_Payment" oninput="calculateCreditVault()" placeholder="Min 25%" required>
                    </div>
                    <div class="form-group">
                        <label>Tenure Weeks *</label>
                        <select id="Tenure_Weeks" onchange="calculateCreditVault()" required>
                            <option value="10">10 Weeks</option>
                            <option value="15">15 Weeks</option>
                            <option value="20">20 Weeks</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Setup Fee (₹)</label>
                        <input type="number" id="Setup_Fee" readonly style="background-color: #f1f5f9;">
                    </div>
                    <div class="form-group">
                        <label>Processing Fee (₹)</label>
                        <input type="number" id="Processing_Fee" readonly style="background-color: #f1f5f9;">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Weekly EMI Amount (₹)</label>
                        <input type="number" id="Weekly_EMI_Amount" readonly style="background-color: #f1f5f9; font-weight: bold; color: #2F855A;">
                    </div>
                    <div class="form-group">
                        <label>Disbursed Amount (₹)</label>
                        <input type="number" id="Disbursed_Amount" readonly style="background-color: #f1f5f9;">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Payment to Retailer (₹)</label>
                        <input type="number" id="Payment_to_Retailer" readonly style="background-color: #f1f5f9;">
                    </div>
                    <div class="form-group">
                        <label>Document Charge (₹)</label>
                        <input type="number" id="Document_Charge" value="100" readonly style="background-color: #f1f5f9;">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Status *</label>
                        <select id="Status" required>
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="PENDING">PENDING</option>
                            <option value="CLOSED">CLOSED</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Submit Credit Vault Loan</button>
            </form>
        </div>
    </div>

    <script>
        function handleLoanTypeChange() {
            const loanType = document.getElementById('Loan_Type').value;
            const mobileFields = document.getElementById('mobileFields');
            const serialField = document.getElementById('serialField');
            
            const year = new Date().getFullYear();
            let prefix = "VML";
            if (loanType === "Mobile") prefix = "VML";
            else if (loanType === "Electrical") prefix = "VEL";
            else if (loanType === "Furniture") prefix = "VFL";
            
            document.getElementById('Loan_ID').value = prefix + "-001/" + year;

            if (loanType === 'Mobile') {
                mobileFields.classList.remove('hidden');
                serialField.classList.add('hidden');
            } else if (loanType === 'Electrical' || loanType === 'Furniture') {
                mobileFields.classList.add('hidden');
                serialField.classList.remove('hidden');
            } else {
                mobileFields.classList.add('hidden');
                serialField.classList.add('hidden');
            }
            calculateCreditVault();
        }

        function calculateCreditVault() {
            const productVal = parseFloat(document.getElementById('Product_Value').value) || 0;
            const tenure = parseInt(document.getElementById('Tenure_Weeks').value) || 10;
            const loanType = document.getElementById('Loan_Type').value;

            if (productVal > 0) {
                const stdDown = productVal * 0.30;
                document.getElementById('Standard_Down_Payment').value = stdDown.toFixed(2);
                
                let custDown = document.getElementById('Customer_Down_Payment').value;
                if (!custDown) {
                    custDown = stdDown;
                    document.getElementById('Customer_Down_Payment').value = stdDown.toFixed(2);
                } else {
                    custDown = parseFloat(custDown);
                }

                let setupFee = productVal * 0.04;
                let processingFee = productVal * 0.025;
                if (loanType === "Electrical" || loanType === "Furniture") {
                    setupFee = productVal * 0.03;
                }

                document.getElementById('Setup_Fee').value = setupFee.toFixed(2);
                document.getElementById('Processing_Fee').value = processingFee.toFixed(2);

                const balance = productVal - custDown;
                const totalCharges = setupFee + processingFee;
                const adjustedPrincipal = balance + totalCharges;

                let emi = 0;
                if (tenure === 10) {
                    emi = (balance * 2722.0) / 23100.0;
                } else if (tenure === 15) {
                    emi = (balance * 1889.0) / 23100.0;
                } else if (tenure === 20) {
                    emi = (balance * 1551.0) / 23100.0;
                } else {
                    emi = adjustedPrincipal / tenure;
                }

                document.getElementById('Weekly_EMI_Amount').value = emi.toFixed(2);
                document.getElementById('Disbursed_Amount').value = balance.toFixed(2);
                document.getElementById('Payment_to_Retailer').value = (productVal - custDown).toFixed(2);
            }
        }

        function validateCreditVault(event) {
            event.preventDefault();
            const productVal = parseFloat(document.getElementById('Product_Value').value) || 0;
            const custDown = parseFloat(document.getElementById('Customer_Down_Payment').value) || 0;
            const minDown = productVal * 0.25;

            if (custDown < minDown) {
                alert(`Error: Customer Down Payment must be at least 25% of product value (Min: ₹${minDown.toFixed(2)})!`);
                return false;
            }

            alert("Credit Vault loan application successfully validated and saved!");
            document.getElementById('creditVaultForm').reset();
            return true;
        }
    </script>
</body>
