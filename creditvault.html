<script>
        function handleLoanTypeChange() {
            const loanType = document.getElementById('Loan_Type').value;
            const mobileFields = document.getElementById('mobileFields');
            const serialField = document.getElementById('serialField');
            
            const year = new Date().getFullYear();
            let prefix = "VML";
            if (loanType === "Mobile") prefix = "VML";
            else if (loanType === "Electrical") prefix = "VEL";
            else if (loanType === "Furniture") prefix = "VFL";
            
            document.getElementById('Loan_ID').value = prefix + "-001/" + year;

            if (loanType === 'Mobile') {
                mobileFields.classList.remove('hidden');
                serialField.classList.add('hidden');
            } else if (loanType === 'Electrical' || loanType === 'Furniture') {
                mobileFields.classList.add('hidden');
                serialField.classList.remove('hidden');
            } else {
                mobileFields.classList.add('hidden');
                serialField.classList.add('hidden');
            }
            calculateCreditVault();
        }

        function calculateCreditVault() {
            const productVal = parseFloat(document.getElementById('Product_Value').value) || 0;
            const tenure = parseInt(document.getElementById('Tenure_Weeks').value) || 10;
            const loanType = document.getElementById('Loan_Type').value;

            if (productVal > 0) {
                const stdDown = productVal * 0.30;
                document.getElementById('Standard_Down_Payment').value = stdDown.toFixed(2);
                
                let custDown = document.getElementById('Customer_Down_Payment').value;
                if (!custDown) {
                    custDown = stdDown;
                    document.getElementById('Customer_Down_Payment').value = stdDown.toFixed(2);
                } else {
                    custDown = parseFloat(custDown);
                }

                let setupFee = productVal * 0.04;
                let processingFee = productVal * 0.025;
                if (loanType === "Electrical" || loanType === "Furniture") {
                    setupFee = productVal * 0.03;
                }

                document.getElementById('Setup_Fee').value = setupFee.toFixed(2);
                document.getElementById('Processing_Fee').value = processingFee.toFixed(2);

                const balance = productVal - custDown;
                const totalCharges = setupFee + processingFee;
                const adjustedPrincipal = balance + totalCharges;

                let emi = 0;
                if (tenure === 10) {
                    emi = (balance * 2722.0) / 23100.0;
                } else if (tenure === 15) {
                    emi = (balance * 1889.0) / 23100.0;
                } else if (tenure === 20) {
                    emi = (balance * 1551.0) / 23100.0;
                } else {
                    emi = adjustedPrincipal / tenure;
                }

                document.getElementById('Weekly_EMI_Amount').value = emi.toFixed(2);
                document.getElementById('Disbursed_Amount').value = balance.toFixed(2);
                document.getElementById('Payment_to_Retailer').value = (productVal - custDown).toFixed(2);
            }
        }

        async function validateCreditVault(event) {
            event.preventDefault();
            const productVal = parseFloat(document.getElementById('Product_Value').value) || 0;
            const custDown = parseFloat(document.getElementById('Customer_Down_Payment').value) || 0;
            const minDown = productVal * 0.25;

            if (custDown < minDown) {
                alert(`Error: Customer Down Payment must be at least 25% of product value (Min: ₹${minDown.toFixed(2)})!`);
                return false;
            }

            // 1. ஃபார்ம் தகவல்களைச் சேகரித்தல்
            const borrowerSelect = document.getElementById('Borrowers_Details');
            const borrowerName = borrowerSelect.options[borrowerSelect.selectedIndex].text.split('(')[0].trim();
            const loanType = document.getElementById('Loan_Type').value;
            const productName = document.getElementById('Product_Name').value.trim();
            const weeklyEmi = document.getElementById('Weekly_EMI_Amount').value;
            const tenureWeeks = document.getElementById('Tenure_Weeks').value;
            const loanId = document.getElementById('Loan_ID').value;
            
            // கஸ்டமர் வாட்ஸ்அப் எண் (தேவைக்கேற்ப மாற்றிக்கொள்ளலாம் அல்லது லோக்கல் ஸ்டோரேஜில் இருந்து எடுக்கலாம்)
            const customerPhone = "9876543210"; 

            // 2. LocalStorage-ல் கிரெடிட் வால்ட் லோனைச் சேமித்தல்
            let creditVaultLoans = JSON.parse(localStorage.getItem('velfincorp_creditvault') || '[]');
            creditVaultLoans.push({
                loanId: loanId,
                borrowerName: borrowerName,
                productName: productName,
                productValue: productVal.toString(),
                tenure: tenureWeeks + " Weeks",
                weeklyEmi: weeklyEmi,
                status: "ACTIVE",
                loanDate: new Date().toLocaleDateString()
            });
            localStorage.setItem('velfincorp_creditvault', JSON.stringify(creditVaultLoans));

            // 3. MSG91 API மூலம் Welcome Message அனுப்புவது
            const authKey = "563191ANiWhsCHw6a8aff47P1"; 
            const wabaNumber = "919486886293";   
            const templateName = "vel_fin_welcome_message";

            let cleanMobile = customerPhone.replace("+", "").replace(/\s+/g, "").replace(/-/g, "");
            if (cleanMobile.length > 10) {
                cleanMobile = cleanMobile.substring(cleanMobile.length - 10);
            }
            const finalMobile = "91" + cleanMobile;

            // தேதிகள் மற்றும் வாரத்தின் நாட்களைக் கணக்கிடுதல்
            const today = new Date();
            const options = { weekday: 'long' };
            const loanDay = today.toLocaleDateString('en-US', options);
            const loanDateStr = today.toLocaleDateString('en-GB');

            let previousDayText = "முந்தைய நாள் இரவு 12:00 மணிக்கு முன்பு";
            const dayMap = {
                "Monday": "ஞாயிற்றுக்கிழமை இரவு 12:00 மணி (அதாவது திங்கட்கிழமை தொடங்குவதற்கு முன்பு)",
                "Tuesday": "திங்கட்கிழமை இரவு 12:00 மணி (அதாவது செவ்வாய்க்கிழமை தொடங்குவதற்கு முன்பு)",
                "Wednesday": "செவ்வாய்க்கிழமை இரவு 12:00 மணி (அதாவது புதன்கிழமை தொடங்குவதற்கு முன்பு)",
                "Thursday": "புதன்கிழமை இரவு 12:00 மணி (அதாவது வியாழக்கிழமை தொடங்குவதற்கு முன்பு)",
                "Friday": "வியாழக்கிழமை இரவு 12:00 மணி (அதாவது வெள்ளிக்கிழமை தொடங்குவதற்கு முன்பு)",
                "Saturday": "வெள்ளிக்கிழமை இரவு 12:00 மணி (அதாவது சனிக்கிழமை தொடங்குவதற்கு முன்பு)",
                "Sunday": "சனிக்கிழமை இரவு 12:00 மணி (அதாவது ஞாயிற்றுக்கிழமை தொடங்குவதற்கு முன்பு)"
            };
            if (dayMap[loanDay]) {
                previousDayText = dayMap[loanDay];
            }

            const payload = {
                "messaging_product": "whatsapp",
                "type": "template",
                "template": {
                    "name": templateName,
                    "language": {
                        "code": "ta",
                        "policy": "deterministic"
                    },
                    "to_and_components": [
                        {
                            "to": [finalMobile],
                            "components": {
                                "body_1": { "type": "text", "value": borrowerName },
                                "body_2": { "type": "text", "value": loanType },
                                "body_3": { "type": "text", "value": productName },
                                "body_4": { "type": "text", "value": weeklyEmi.toString() },
                                "body_5": { "type": "text", "value": tenureWeeks.toString() },
                                "body_6": { "type": "text", "value": loanDay },
                                "body_7": { "type": "text", "value": loanDateStr },
                                "body_8": { "type": "text", "value": previousDayText },
                                "body_9": { "type": "text", "value": "12:00" }
                            }
                        }
                    ]
                }
            };

            try {
                const response = await fetch("https://control.msg91.com/api/v5/whatsapp/whatsapp-outbound-message/bulk/", {
                    method: "POST",
                    headers: {
                        "authkey": authKey,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "integrated_number": wabaNumber,
                        "content_type": "template",
                        "payload": payload
                    })
                });

                const result = await response.json();
                console.log("MSG91 Welcome Response:", result);
                alert("Credit Vault loan successfully saved and Welcome Message sent automatically via WhatsApp!");
            } catch (error) {
                console.error("Error sending WhatsApp welcome message:", error);
                alert("Loan saved, but automated WhatsApp welcome message failed due to network.");
            }

            document.getElementById('creditVaultForm').reset();
            return true;
        }
    </script>
