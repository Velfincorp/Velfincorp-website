<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Vel Fin Corp - Retailer Details Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        (function() {
            const currentPage = window.location.pathname.split("/").pop() || "index.html";
            const loggedUser = sessionStorage.getItem('velfincorp_logged_user');
            const userRole = sessionStorage.getItem('velfincorp_role');

            window.pageshow = function(event) {
                if (event.persisted || !sessionStorage.getItem('velfincorp_logged_user')) {
                    window.location.replace('login.html');
                }
            };

            const publicPages = ['index.html', 'login.html', 'contact.html', ''];
            if (publicPages.includes(currentPage)) return;

            if (!loggedUser || !userRole) {
                window.location.replace('login.html');
                return;
            }
        })();
    </script>
    <style>
        :root {
            --navy: #0F1D36;
            --gold: #C5A059;
            --bg-color: #F8F9FB;
            --text-main: #2D3748;
            --white: #FFFFFF;
            --danger: #C53030;
        }
        body {
            font-family: 'Manrope', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--white);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(15, 29, 54, 0.08);
            border-top: 5px solid var(--navy);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h2 {
            font-family: 'Cinzel', serif;
            color: var(--navy);
            margin: 0;
            font-size: 22px;
        }
        .back-btn {
            background-color: var(--gold);
            color: var(--navy);
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            font-size: 13px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--navy);
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
        }
        .btn-submit {
            background-color: var(--navy);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
        }
        .btn-submit:hover {
            background-color: var(--gold);
            color: var(--navy);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>VEL FIN CORP - Retailer Details Registration</h2>
            <a href="dashboard.html" class="back-btn">&larr; Back to Dashboard</a>
        </div>

        <form id="retailerForm" onsubmit="saveRetailer(event)">
            <div class="form-group">
                <label>Show Room Name *</label>
                <input type="text" id="showroomName" placeholder="Enter showroom name" required>
            </div>

            <div class="form-group">
                <label>Retailer Code (Auto-generated)</label>
                <input type="text" id="retailerCode" value="VFC-RET-2026-001" readonly style="background: #f1f5f9;">
            </div>

            <div class="form-group">
                <label>Owner Name *</label>
                <input type="text" id="ownerName" placeholder="Enter owner name" required>
            </div>

            <div class="form-group">
                <label>WhatsApp Number *</label>
                <input type="text" id="whatsappNumber" placeholder="10 digit number" maxlength="10" required>
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="retailerEmail" placeholder="Enter email address" required>
            </div>

            <div class="form-group">
                <label>City / Location *</label>
                <input type="text" id="cityLocation" placeholder="Enter city or location" required>
            </div>

            <div class="form-group">
                <label>GST #</label>
                <input type="text" id="gstNumber" placeholder="Enter GST number (Optional)">
            </div>

            <button type="submit" class="btn-submit"><i class="fas fa-save"></i> Save Retailer Details</button>
        </form>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Auto generate code
            let retailers = JSON.parse(localStorage.getItem('velfincorp_retailers') || '[]');
            let nextCode = `VFC-RET-2026-00${retailers.length + 1}`;
            document.getElementById('retailerCode').value = nextCode;
        });

        function saveRetailer(event) {
            event.preventDefault();

            const retailer = {
                code: document.getElementById('retailerCode').value,
                showroom: document.getElementById('showroomName').value.trim(),
                owner: document.getElementById('ownerName').value.trim(),
                whatsapp: document.getElementById('whatsappNumber').value.trim(),
                email: document.getElementById('retailerEmail').value.trim(),
                city: document.getElementById('cityLocation').value.trim(),
                gst: document.getElementById('gstNumber').value.trim(),
                date: new Date().toLocaleDateString()
            };

            let retailers = JSON.parse(localStorage.getItem('velfincorp_retailers') || '[]');
            retailers.push(retailer);
            localStorage.setItem('velfincorp_retailers', JSON.stringify(retailers));

            alert("Retailer details saved successfully!");
            document.getElementById('retailerForm').reset();
            
            // Refresh code
            let nextCode = `VFC-RET-2026-00${retailers.length + 1}`;
            document.getElementById('retailerCode').value = nextCode;
        }
    </script>
</body>
</html>
