<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Vel Fin Corp - Select Loan Category</title>
    
    <script>
        // Centralized Authentication & Security Protection Script
        (function() {
            const currentPage = window.location.pathname.split("/").pop() || "index.html";
            const loggedUser = sessionStorage.getItem('velfincorp_logged_user');
            const userRole = sessionStorage.getItem('velfincorp_role');

            // 1. Prevent back/forward cache browsing after logout
            window.pageshow = function(event) {
                if (event.persisted || !sessionStorage.getItem('velfincorp_logged_user')) {
                    window.location.replace('login.html');
                }
            };

            // 2. Public pages that don't require login
            const publicPages = ['index.html', 'login.html', 'contact.html', ''];
            if (publicPages.includes(currentPage)) {
                return; // Allow public access
            }

            // 3. If not logged in, redirect to login page immediately
            if (!loggedUser || !userRole) {
                window.location.replace('login.html');
                return;
            }

            // 4. Role-based Access Control (RBAC) Enforcement
            if (userRole === 'borrower') {
                if (currentPage !== 'borrower-portal.html') {
                    window.location.replace('borrower-portal.html');
                }
            } else {
                if (currentPage === 'borrower-portal.html') {
                    window.location.replace('dashboard.html');
                }
            }
        })();
    </script>

    <style>
        :root {
            --primary-navy: #0B1D3A;
            --accent-gold: #C5A059;
            --bg-light: #F4F6F9;
            --text-dark: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(11, 29, 58, 0.1);
            border-top: 5px solid var(--primary-navy);
            text-align: center;
        }
        h2 {
            color: var(--primary-navy);
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .btn-option {
            background-color: var(--primary-navy);
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .btn-option:hover {
            background-color: var(--accent-gold);
            color: var(--primary-navy);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>VEL FIN CORP</h2>
    <p>பாரோவர் பதிவு வெற்றிகரமாக முடிந்தது! அடுத்ததாக தேவையான லோன் வகையைத் தேர்ந்தெடுக்கவும்:</p>

    <button class="btn-option" onclick="selectLoan('creditvault')">Credit Vault (Product Loans: Mobile / Electronics / Furniture)</button>
    <button class="btn-option" onclick="selectLoan('personalloan')">Personal Loan (Daily / Weekly / Monthly)</button>
</div>

<script>
    function selectLoan(type) {
        if (type === 'creditvault') {
            window.location.href = 'creditvault.html';
        } else if (type === 'personalloan') {
            window.location.href = 'personalloan.html';
        }
    }
</script>

</body>
</html>
