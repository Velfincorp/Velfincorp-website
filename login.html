<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Vel Fin Corp - Secure Portal Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    <script src="db.js"></script>
    <script>
        // லாகின் பக்கத்திற்கு எப்போது வந்தாலும் (அல்லது Back பட்டன் மூலம் வந்தாலும்) செஷனை உடனடியாக அழித்து, மீண்டும் யூசர்நேம்/பாஸ்வேர்ட் கேட்க வைக்கும் பாதுகாப்பு கோடு
        function clearSessionAndRequireLogin() {
            sessionStorage.clear();
            localStorage.removeItem('velfincorp_logged_user');
            const form = document.getElementById('loginForm');
            if (form) form.reset();
            const btn = document.getElementById('loginBtn');
            if (btn) {
                btn.disabled = false;
                btn.innerText = "Secure Login";
            }
        }

        clearSessionAndRequireLogin();
        window.addEventListener('pageshow', clearSessionAndRequireLogin);
        window.addEventListener('popstate', clearSessionAndRequireLogin);
    </script>
    <style>
        :root {
            --navy: #0F1D36;
            --gold: #C5A059;
            --bg-color: #F8F9FB;
            --text-main: #2D3748;
            --white: #FFFFFF;
            --danger: #C53030;
        }
        body {
            font-family: 'Manrope', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: var(--white);
            width: 400px;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(15, 29, 54, 0.08);
            border-top: 5px solid var(--navy);
            text-align: center;
        }
        .login-card h2 {
            font-family: 'Cinzel', serif;
            color: var(--navy);
            margin-bottom: 5px;
        }
        .login-card p {
            color: var(--gold);
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--navy);
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
        }
        .pass-wrapper {
            position: relative;
        }
        .toggle-pass {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #64748b;
        }
        .btn-login {
            background-color: var(--navy);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-login:hover {
            background-color: var(--gold);
            color: var(--navy);
        }
        .btn-login:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>VEL FIN CORP</h2>
        <p>Secure Enterprise Portal Login</p>

        <form id="loginForm" onsubmit="handleLogin(event)" autocomplete="off">
            <div class="form-group">
                <label>Select User Role *</label>
                <select id="userRole" required>
                    <option value="">-Select Role-</option>
                    <option value="admin">Admin / Management</option>
                    <option value="retailer">Retailer / Showroom Partner</option>
                    <option value="staff">Staff / Collection Agent</option>
                    <option value="borrower">Borrower / Customer</option>
                </select>
            </div>

            <div class="form-group">
                <label>Username / ID / Mobile *</label>
                <input type="text" id="username" placeholder="Registered mobile number" autocomplete="off" required>
            </div>

            <div class="form-group">
                <label>Password / PIN *</label>
                <div class="pass-wrapper">
                    <input type="password" id="password" placeholder="Enter password (e.g., Vel@8425 or PIN)" autocomplete="new-password" required>
                    <i class="fas fa-eye toggle-pass" id="togglePassIcon" onclick="togglePasswordVisibility()"></i>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="btn-login">Secure Login</button>
        </form>
    </div>

    <script>
        const RETAILERS_COLLECTION_ID = (window.VFC_DB && VFC_DB.RETAILERS_ID) ? VFC_DB.RETAILERS_ID : '6ada05fd0007206813cf';

        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('togglePassIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            sessionStorage.clear();

            const role = document.getElementById('userRole').value;
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');

            if (role === 'borrower') {
                if (username.length !== 10) {
                    alert("தயவுசெய்து சரியான 10 இலக்க மொபைல் எண்ணை உள்ளிடவும்.");
                    return;
                }
                const expectedPassword = username.slice(-4);
                if (password === expectedPassword || password.toLowerCase() === ('vel@' + expectedPassword)) {
                    sessionStorage.setItem('velfincorp_logged_user', username);
                    sessionStorage.setItem('velfincorp_role', 'borrower');
                    sessionStorage.setItem('velfincorp_permissions', JSON.stringify(['borrower-portal.html']));
                    window.location.replace('borrower-portal.html');
                } else {
                    alert("தவறான பாஸ்வேர்ட்! உங்கள் மொபைல் எண்ணின் கடைசி 4 இலக்கங்களை உள்ளிடவும்.");
                }
                return;
            }

            if (role === 'admin') {
                sessionStorage.setItem('velfincorp_logged_user', username);
                sessionStorage.setItem('velfincorp_role', 'admin');
                sessionStorage.removeItem('velfincorp_permissions');
                window.location.replace('dashboard.html');
                return;
            }

            // Retailer & Staff Cloud Verification
            loginBtn.disabled = true;
            loginBtn.innerText = "Verifying...";

            try {
                const res = await window.appwriteDatabases.listDocuments(
                    VFC_DB.DB_ID,
                    RETAILERS_COLLECTION_ID,
                    [window.AppwriteQuery.limit(100)]
                );
                const docs = res.documents || [];
                const matchedUser = docs.find(d => 
                    String(d.whatsapp_number || '').trim() === username &&
                    String(d.user_type || '').toLowerCase() === role.toLowerCase()
                );

                if (!matchedUser) {
                    alert("இந்த மொபைல் எண்ணில் " + role.toUpperCase() + " கணக்கு எதுவும் இல்லை!");
                    loginBtn.disabled = false;
                    loginBtn.innerText = "Secure Login";
                    return;
                }

                const dbPass = String(matchedUser.password || '').trim();
                const last4 = username.slice(-4);
                const velFormatPass = 'vel@' + last4;

                const isPasswordValid = (
                    password === dbPass ||
                    password.toLowerCase() === dbPass.toLowerCase() ||
                    password.toLowerCase() === velFormatPass ||
                    password === last4
                );

                if (!isPasswordValid) {
                    alert("தவறான பாஸ்வேர்ட்! சரியான பாஸ்வேர்டை உள்ளிடவும்.");
                    loginBtn.disabled = false;
                    loginBtn.innerText = "Secure Login";
                    return;
                }

                // ரீடெய்லருக்கு எப்போதும் 2 மாடியூல்கள் மட்டுமே (Borrower Details & Credit Vault Loan)
                let allowedModules = ['borrowers-details.html', 'creditvault.html'];
                if (role === 'staff') {
                    if (matchedUser.address && matchedUser.address.includes('.html')) {
                        allowedModules = matchedUser.address
                            .split(',')
                            .map(s => s.trim() === 'Support Mail' ? 'mail-inbox.html' : s.trim())
                            .filter(s => s && s !== 'dashboard.html');
                    } else {
                        allowedModules = ['borrowers-details.html', 'payments.html'];
                    }
                }

                sessionStorage.setItem('velfincorp_logged_user', username);
                sessionStorage.setItem('velfincorp_role', role);
                sessionStorage.setItem('velfincorp_user_name', matchedUser.show_room_name || username);
                sessionStorage.setItem('velfincorp_permissions', JSON.stringify(allowedModules));

                window.location.replace(allowedModules[0] || 'borrowers-details.html');
            } catch (err) {
                console.error("Login verification error:", err);
                alert("Login Error: " + err.message);
                loginBtn.disabled = false;
                loginBtn.innerText = "Secure Login";
            }
        }
    </script>
</body>
</html>
