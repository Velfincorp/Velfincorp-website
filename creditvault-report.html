<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Vel Fin Corp - Credit Vault Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    <script src="db.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        // Centralized Authentication & Security Protection Script
        (function() {
            const currentPage = window.location.pathname.split("/").pop() || "index.html";
            const loggedUser = sessionStorage.getItem('velfincorp_logged_user');
            const userRole = sessionStorage.getItem('velfincorp_role');

            window.pageshow = function(event) {
                if (event.persisted || !sessionStorage.getItem('velfincorp_logged_user')) {
                    window.location.replace('login.html');
                }
            };

            const publicPages = ['index.html', 'login.html', 'contact.html', ''];
            if (publicPages.includes(currentPage)) {
                return; 
            }

            if (!loggedUser || !userRole) {
                window.location.replace('login.html');
                return;
            }

            if (userRole === 'borrower') {
                if (currentPage !== 'borrower-portal.html') {
                    window.location.replace('borrower-portal.html');
                }
            } else {
                if (currentPage === 'borrower-portal.html') {
                    window.location.replace('dashboard.html');
                }
            }
        })();
    </script>
    <style>
        :root {
            --navy: #0F1D36;
            --gold: #C5A059;
            --bg-color: #F8F9FB;
            --text-main: #2D3748;
            --white: #FFFFFF;
            --danger: #C53030;
        }
        body {
            font-family: 'Manrope', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--white);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(15, 29, 54, 0.08);
            border-top: 5px solid var(--navy);
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        h2 {
            font-family: 'Cinzel', serif;
            color: var(--navy);
            margin: 0;
            font-size: 24px;
        }
        .back-btn {
            background: var(--gold);
            color: var(--navy);
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }
        .filter-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-box, .filter-select {
            flex: 1;
            min-width: 200px;
            padding: 11px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background: var(--white);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 12px 15px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: var(--navy);
            color: white;
            font-family: 'Cinzel', serif;
        }
        tr:hover {
            background-color: #f8fafc;
            cursor: pointer;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--white);
            width: 750px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            border-top: 5px solid var(--navy);
        }
        .modal-header {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            color: var(--navy);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .btn-print {
            background-color: var(--navy);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-pdf {
            background-color: var(--gold);
            color: var(--navy);
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .close-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .profile-table {
            width: 100%;
            border-collapse: collapse;
        }
        .profile-table td {
            padding: 10px 15px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
        }
        .profile-table td:first-child {
            font-weight: bold;
            color: var(--navy);
            width: 40%;
            background: #f1f5f9;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <a href="dashboard.html" class="back-btn">&larr; Back to Dashboard</a>
        <h2>Credit Vault Loans Report</h2>
    </div>

    <!-- Search & Filters -->
    <div class="filter-row">
        <input type="text" id="searchInput" class="search-box" placeholder="Search by Borrower Name or Phone Number..." onkeyup="filterTable()">
        
        <!-- Date Filter -->
        <input type="date" id="dateFilter" class="filter-select" onchange="filterTable()" title="Filter by Loan Date">

        <select id="loanTypeFilter" class="filter-select" onchange="filterTable()">
            <option value="">-All Loan Types-</option>
            <option value="Mobile Phone">Mobile Phone</option>
            <option value="Home Appliance">Home Appliance</option>
            <option value="Furniture">Furniture</option>
            <option value="Jewel Loan">Jewel Loan</option>
        </select>

        <select id="statusFilter" class="filter-select" onchange="filterTable()">
            <option value="">-All Status-</option>
            <option value="ACTIVE">ACTIVE</option>
            <option value="PENDING">PENDING</option>
            <option value="CLOSED">CLOSED</option>
            <option value="PAID">PAID</option>
            <option value="DELAYED">DELAYED</option>
            <option value="OVERDUE">OVERDUE</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Loan ID</th>
                <th>Borrower Name</th>
                <th>Phone Number</th>
                <th>Loan Type</th>
                <th>Loan Amount</th>
                <th>Tenure</th>
                <th>Weekly EMI</th>
                <th>Payment Status</th>
            </tr>
        </thead>
        <tbody id="reportTableBody">
            <tr><td colspan="8" style="text-align: center;">Loading credit vault loans from database...</td></tr>
        </tbody>
    </table>
</div>

<!-- Modal Popup for Full Loan & Borrower Details -->
<div class="modal" id="loanModal">
    <div class="modal-content" id="printableArea">
        <div class="modal-header">
            <span>Credit Vault Loan & Borrower Full Profile</span>
            <div class="modal-actions">
                <button class="btn-print" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
                <button class="btn-pdf" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
                <button class="close-btn" onclick="closeModal()">X</button>
            </div>
        </div>
        <div id="modalBody">
            <!-- Details loaded dynamically -->
        </div>
    </div>
</div>

<script>
    let currentLoan = null;
    let allCreditVaultLoans = [];
    let allPayments = [];
    let allBorrowers = [];

    window.addEventListener('DOMContentLoaded', async () => {
        await loadReportData();
    });

    function formatIndianDate(dateStr) {
        if (!dateStr) return '-';
        if (dateStr.includes('/')) {
            const parts = dateStr.split('/');
            if (parts.length === 3 && parts[0].length <= 2 && parts[2].length === 4) {
                return `${parts[1].padStart(2, '0')}/${parts[0].padStart(2, '0')}/${parts[2]}`;
            }
            return dateStr;
        }
        if (dateStr.includes('-')) {
            const parts = dateStr.split('-');
            if (parts.length === 3 && parts[0].length === 4) {
                return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
            }
        }
        try {
            const d = new Date(dateStr);
            if (!isNaN(d.getTime())) {
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const year = d.getFullYear();
                return `${day}/${month}/${year}`;
            }
        } catch (e) {
            console.error("Date format error:", e);
        }
        return dateStr;
    }

    async function loadReportData() {
        const tbody = document.getElementById('reportTableBody');
        try {
            const [loansRes, paymentsRes, borrowersRes] = await Promise.all([
                window.appwriteDatabases.listDocuments(VFC_DB.DB_ID, VFC_DB.LOANS_ID),
                window.appwriteDatabases.listDocuments(VFC_DB.DB_ID, VFC_DB.PAYMENTS_ID).catch(() => ({ documents: [] })),
                window.appwriteDatabases.listDocuments(VFC_DB.DB_ID, VFC_DB.BORROWERS_ID).catch(() => ({ documents: [] }))
            ]);

            allPayments = paymentsRes.documents || [];
            allBorrowers = borrowersRes.documents || [];
            const allLoans = loansRes.documents || [];

            if (!allLoans || allLoans.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No credit vault loans found in database.</td></tr>';
                return;
            }

            allCreditVaultLoans = allLoans.filter(loan => {
                const category = loan.loan_category ? loan.loan_category.trim() : '';
                const loanId = loan.loan_id ? loan.loan_id.toUpperCase() : '';
                return category === 'Credit Vault' || loanId.startsWith('VML') || loanId.startsWith('VFL') || loanId.startsWith('VHL') || loanId.startsWith('VJL');
            });

            // Sort loans by date descending (Newest first)
            allCreditVaultLoans.sort((a, b) => {
                const dateA = new Date(a.loan_date || a.$createdAt || 0);
                const dateB = new Date(b.loan_date || b.$createdAt || 0);
                return dateB - dateA;
            });

            renderTable(allCreditVaultLoans);
        } catch(error) {
            console.error("Error loading credit vault reports:", error);
            tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--danger);">Error loading data: ${error.message}</td></tr>`;
        }
    }

    // Determine Payment Status (Paid, Delayed, Overdue) based on payment history and dates
    function getPaymentStatusInfo(loan) {
        const loanPayments = allPayments.filter(p => p.loan_id === loan.loan_id || p.borrower_name === loan.borrower_name);
        const today = new Date();
        const loanDate = new Date(loan.loan_date || loan.$createdAt);
        const diffTime = Math.abs(today - loanDate);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        const expectedWeeks = Math.floor(diffDays / 7) + 1;

        let totalPaidAmt = 0;
        loanPayments.forEach(p => {
            totalPaidAmt += parseFloat(p.amount_paid || p.paid_amount || p.amount || 0);
        });

        const weeklyEmi = parseFloat(loan.installment_amount || 0);
        const expectedPaidAmt = weeklyEmi * Math.min(expectedWeeks, 30);

        if (loan.status === 'CLOSED') return { label: 'CLOSED', color: '#C53030' };
        if (totalPaidAmt >= expectedPaidAmt) return { label: 'PAID', color: '#2F855A' };
        if (diffDays > (loanPayments.length + 1) * 7 + 7) return { label: 'OVERDUE', color: '#C53030' };
        return { label: 'DELAYED', color: '#D69E2E' };
    }

    function renderTable(loans) {
        const tbody = document.getElementById('reportTableBody');
        if (loans.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No matching credit vault loans found.</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        loans.forEach((loan) => {
            const tr = document.createElement('tr');
            tr.onclick = () => showLoanDetails(loan);
            
            const payStatus = getPaymentStatusInfo(loan);
            tr.innerHTML = `
                <td><strong>${loan.loan_id || '-'}</strong></td>
                <td>${loan.borrower_name || '-'}</td>
                <td>${loan.phone_number || '-'}</td>
                <td>${loan.product_category || loan.loan_type || '-'}</td>
                <td>₹${loan.loan_amount || '0'}</td>
                <td>${loan.tenure || '-'}</td>
                <td>₹${loan.installment_amount || '0'}</td>
                <td><span style="color: ${payStatus.color}; font-weight: bold;">${payStatus.label}</span></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filterTable() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const dateInput = document.getElementById('dateFilter').value; // Selected Date (YYYY-MM-DD)
        const typeFilter = document.getElementById('loanTypeFilter').value;
        const statusFilter = document.getElementById('statusFilter').value;

        const filtered = allCreditVaultLoans.filter(loan => {
            const name = (loan.borrower_name || '').toLowerCase();
            const phone = (loan.phone_number || '').toLowerCase();
            const loanId = (loan.loan_id || '').toLowerCase();
            const type = loan.product_category || loan.loan_type || '';
            const status = loan.status || 'ACTIVE';
            const payStatus = getPaymentStatusInfo(loan).label;
            const loanDateVal = (loan.loan_date || '').split('T')[0]; // YYYY-MM-DD format

            const matchesSearch = name.includes(input) || phone.includes(input) || loanId.includes(input);
            const matchesDate = !dateInput || loanDateVal === dateInput;
            const matchesType = typeFilter === '' || type === typeFilter;
            const matchesStatus = statusFilter === '' || status === statusFilter || payStatus === statusFilter;

            return matchesSearch && matchesDate && matchesType && matchesStatus;
        });

        renderTable(filtered);
    }

    function showLoanDetails(loan) {
        currentLoan = loan;
        const modal = document.getElementById('loanModal');
        const modalBody = document.getElementById('modalBody');
        const formattedDate = formatIndianDate(loan.loan_date);

        const matchedBorrower = allBorrowers.find(b => b.full_name === loan.borrower_name || b.phone_number === loan.phone_number);
        const borrowerIdStr = matchedBorrower && matchedBorrower.borrower_id ? ` (${matchedBorrower.borrower_id})` : '';
        const customerDisplayName = (loan.borrower_name || '-') + borrowerIdStr;

        const loanPayments = allPayments.filter(p => p.loan_id === loan.loan_id || p.borrower_name === loan.borrower_name);
        let paidAmount = 0;
        loanPayments.forEach(p => {
            paidAmount += parseFloat(p.amount_paid || p.paid_amount || p.amount || 0);
        });

        const installmentAmt = parseFloat(loan.installment_amount || 0);
        const paidInstallments = installmentAmt > 0 ? Math.floor(paidAmount / installmentAmt) : loanPayments.length;
        
        let totalTenure = 10;
        if (loan.tenure) {
            const numMatch = loan.tenure.match(/\d+/);
            if (numMatch) totalTenure = parseInt(numMatch[0]);
        }

        const remainingInstallments = Math.max(0, totalTenure - paidInstallments);
        const totalLoanAmtNum = parseFloat(loan.loan_amount || 0);
        const remainingAmount = Math.max(0, totalLoanAmtNum - paidAmount);
        const payStatus = getPaymentStatusInfo(loan);

        modalBody.innerHTML = `
            <table class="profile-table">
                <tr><th colspan="2" style="background: var(--navy); color: white; text-align: center;">Loan Information</th></tr>
                <tr><td>Loan ID</td><td>${loan.loan_id || '-'}</td></tr>
                <tr><td>Product Category & Name</td><td>${loan.product_category || '-'} | ${loan.product_name || '-'}</td></tr>
                <tr><td>Total Loan Amount</td><td>₹${totalLoanAmtNum.toFixed(2)}</td></tr>
                <tr><td>Down Payment</td><td>₹${loan.down_payment || '0'}</td></tr>
                <tr><td>Weekly EMI Amount</td><td>₹${installmentAmt.toFixed(2)}</td></tr>
                <tr><td>Tenure</td><td>${loan.tenure || totalTenure + ' Weeks'}</td></tr>
                <tr><td>Paid Installments</td><td>${paidInstallments} / ${totalTenure}</td></tr>
                <tr><td>Remaining Installments</td><td>${remainingInstallments}</td></tr>
                <tr><td>Total Paid Amount</td><td>₹${paidAmount.toFixed(2)}</td></tr>
                <tr><td>Remaining Balance Amount</td><td>₹${remainingAmount.toFixed(2)}</td></tr>
                <tr><td>Loan Date</td><td>${formattedDate}</td></tr>
                <tr><td>Payment Status</td><td><span style="font-weight: bold; color: ${payStatus.color};">${payStatus.label}</span></td></tr>
                <tr><td>Loan Status</td><td>${loan.status || 'ACTIVE'}</td></tr>
                
                <tr><th colspan="2" style="background: var(--navy); color: white; text-align: center;">Borrower Details</th></tr>
                <tr><td>Customer Name</td><td>${customerDisplayName}</td></tr>
                <tr><td>Phone Number</td><td>${loan.phone_number || '-'}</td></tr>
            </table>
        `;
        modal.style.display = 'flex';
    }

    function downloadPDF() {
        const element = document.getElementById('printableArea');
        const actions = element.querySelector('.modal-actions');
        actions.style.display = 'none';

        let fileName = "Credit_Vault_Loan_Profile.pdf";
        if (currentLoan) {
            const cleanName = (currentLoan.borrower_name || 'Customer').replace(/[^a-zA-Z0-9]/g, '_');
            const cleanId = (currentLoan.loan_id || 'Loan').replace(/[^a-zA-Z0-9]/g, '_');
            fileName = `${cleanName}_${cleanId}.pdf`;
        }

        const opt = {
            margin:       10,
            filename:     fileName,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().from(element).set(opt).save().then(() => {
            actions.style.display = 'flex';
        });
    }

    function closeModal() {
        document.getElementById('loanModal').style.display = 'none';
    }

    function handleLogout() {
        sessionStorage.clear();
        localStorage.removeItem('velfincorp_logged_user');
        window.location.replace('login.html');
    }
</script>

</body>
</html>
