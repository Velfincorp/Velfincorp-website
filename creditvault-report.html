<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Vel Fin Corp - Credit Vault Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    <script src="db.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        // Centralized Authentication & Security Protection Script
        (function() {
            const currentPage = window.location.pathname.split("/").pop() || "index.html";
            const loggedUser = sessionStorage.getItem('velfincorp_logged_user');
            const userRole = sessionStorage.getItem('velfincorp_role');

            window.pageshow = function(event) {
                if (event.persisted || !sessionStorage.getItem('velfincorp_logged_user')) {
                    window.location.replace('login.html');
                }
            };

            const publicPages = ['index.html', 'login.html', 'contact.html', ''];
            if (publicPages.includes(currentPage)) {
                return; 
            }

            if (!loggedUser || !userRole) {
                window.location.replace('login.html');
                return;
            }

            if (userRole === 'borrower') {
                if (currentPage !== 'borrower-portal.html') {
                    window.location.replace('borrower-portal.html');
                }
            } else {
                if (currentPage === 'borrower-portal.html') {
                    window.location.replace('dashboard.html');
                }
            }
        })();
    </script>
    <style>
        :root {
            --navy: #0F1D36;
            --gold: #C5A059;
            --bg-color: #F8F9FB;
            --text-main: #2D3748;
            --white: #FFFFFF;
            --danger: #C53030;
        }
        body {
            font-family: 'Manrope', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--white);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(15, 29, 54, 0.08);
            border-top: 5px solid var(--navy);
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        h2 {
            font-family: 'Cinzel', serif;
            color: var(--navy);
            margin: 0;
            font-size: 24px;
        }
        .back-btn {
            background: var(--gold);
            color: var(--navy);
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }
        .search-box {
            width: 100%;
            padding: 10px 15px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 12px 15px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: var(--navy);
            color: white;
            font-family: 'Cinzel', serif;
        }
        tr:hover {
            background-color: #f8fafc;
            cursor: pointer;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--white);
            width: 750px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            border-top: 5px solid var(--navy);
        }
        .modal-header {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            color: var(--navy);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .btn-print {
            background-color: var(--navy);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-pdf {
            background-color: var(--gold);
            color: var(--navy);
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .close-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .profile-table {
            width: 100%;
            border-collapse: collapse;
        }
        .profile-table td {
            padding: 10px 15px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
        }
        .profile-table td:first-child {
            font-weight: bold;
            color: var(--navy);
            width: 40%;
            background: #f1f5f9;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <a href="dashboard.html" class="back-btn">&larr; Back to Dashboard</a>
        <h2>Credit Vault Loans Report</h2>
    </div>

    <!-- Search Input for Name or Phone -->
    <input type="text" id="searchInput" class="search-box" placeholder="Search by Borrower Name or Phone Number..." onkeyup="filterTable()">

    <table>
        <thead>
            <tr>
                <th>Loan ID</th>
                <th>Borrower Name</th>
                <th>Phone Number</th>
                <th>Loan Type</th>
                <th>Loan Amount</th>
                <th>Tenure</th>
                <th>Weekly EMI</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="reportTableBody">
            <tr><td colspan="8" style="text-align: center;">Loading credit vault loans from database...</td></tr>
        </tbody>
    </table>
</div>

<!-- Modal Popup for Full Loan & Borrower Details -->
<div class="modal" id="loanModal">
    <div class="modal-content" id="printableArea">
        <div class="modal-header">
            <span>Credit Vault Loan & Borrower Full Profile</span>
            <div class="modal-actions">
                <button class="btn-print" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
                <button class="btn-pdf" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
                <button class="close-btn" onclick="closeModal()">X</button>
            </div>
        </div>
        <div id="modalBody">
            <!-- Details loaded dynamically -->
        </div>
    </div>
</div>

<script>
    let currentLoan = null;

    window.addEventListener('DOMContentLoaded', async () => {
        await loadReportData();
    });

    async function loadReportData() {
        const tbody = document.getElementById('reportTableBody');
        try {
            // Appwrite டேட்டாபேஸில் இருந்து அனைத்து லோன்களையும் பெற்று கிரெடிட் வால்ட் லோன்களை மட்டும் ஸ்மார்ட்டாகப் பிரித்தல்
            const response = await window.appwriteDatabases.listDocuments(
                VFC_DB.DB_ID,
                VFC_DB.LOANS_ID
            );
            const allLoans = response.documents;

            if (!allLoans || allLoans.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No credit vault loans found in database.</td></tr>';
                return;
            }

            // ஸ்மார்ட் ஃபில்டரிங்: loan_category 'CreditVault' ஆக உள்ளவை அல்லது loan_id 'VML', 'VFL', 'VEL', 'VJL' எனத் தொடங்குபவை
            const loans = allLoans.filter(loan => {
                const category = loan.loan_category ? loan.loan_category.trim() : '';
                const loanId = loan.loan_id ? loan.loan_id.toUpperCase() : '';
                return category === 'CreditVault' || loanId.startsWith('VML') || loanId.startsWith('VFL') || loanId.startsWith('VEL') || loanId.startsWith('VJL');
            });

            if (loans.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No credit vault loans found in database.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            loans.forEach((loan) => {
                const tr = document.createElement('tr');
                tr.onclick = () => showLoanDetails(loan);
                tr.innerHTML = `
                    <td><strong>${loan.loan_id || '-'}</strong></td>
                    <td>${loan.borrower_name || '-'}</td>
                    <td>${loan.phone_number || '-'}</td>
                    <td>${loan.loan_type || '-'}</td>
                    <td>₹${loan.loan_amount || '0'}</td>
                    <td>${loan.tenure || '-'}</td>
                    <td>₹${loan.installment_amount || '0'}</td>
                    <td><span style="color: #2F855A; font-weight: bold;">${loan.status || 'ACTIVE'}</span></td>
                `;
                tbody.appendChild(tr);
            });
        } catch(error) {
            console.error("Error loading credit vault reports:", error);
            tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--danger);">Error loading data: ${error.message}</td></tr>`;
        }
    }

    function showLoanDetails(loan) {
        currentLoan = loan;
        const modal = document.getElementById('loanModal');
        const modalBody = document.getElementById('modalBody');

        modalBody.innerHTML = `
            <table class="profile-table">
                <tr><th colspan="2" style="background: var(--navy); color: white; text-align: center;">Loan Information</th></tr>
                <tr><td>Loan ID</td><td>${loan.loan_id || '-'}</td></tr>
                <tr><td>Loan Type</td><td>${loan.loan_type || '-'}</td></tr>
                <tr><td>Product Value</td><td>₹${loan.loan_amount || '-'}</td></tr>
                <tr><td>Disbursed Amount</td><td>₹${loan.disbursed_amount || '-'}</td></tr>
                <tr><td>Tenure & Weekly EMI</td><td>${loan.tenure || '-'} | ₹${loan.installment_amount || '-'} per week</td></tr>
                <tr><td>Loan Date</td><td>${loan.loan_date || '-'}</td></tr>
                <tr><td>Loan Status</td><td>${loan.status || 'ACTIVE'}</td></tr>
                
                <tr><th colspan="2" style="background: var(--navy); color: white; text-align: center;">Borrower Details</th></tr>
                <tr><td>Borrower Name</td><td>${loan.borrower_name || '-'}</td></tr>
                <tr><td>Phone Number</td><td>${loan.phone_number || '-'}</td></tr>
            </table>
        `;
        modal.style.display = 'flex';
    }

    function filterTable() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.getElementById('reportTableBody').getElementsByTagName('tr');

        for (let i = 0; i < rows.length; i++) {
            const nameCol = rows[i].getElementsByTagName('td')[1];
            const phoneCol = rows[i].getElementsByTagName('td')[2];
            const loanIdCol = rows[i].getElementsByTagName('td')[0];

            if (nameCol || phoneCol || loanIdCol) {
                const nameText = nameCol.textContent.toLowerCase();
                const phoneText = phoneCol.textContent.toLowerCase();
                const loanIdText = loanIdCol.textContent.toLowerCase();

                if (nameText.includes(input) || phoneText.includes(input) || loanIdText.includes(input)) {
                    rows[i].style.display = "";
                } else {
                    rows[i].style.display = "none";
                }
            }
        }
    }

    function downloadPDF() {
        const element = document.getElementById('printableArea');
        const actions = element.querySelector('.modal-actions');
        actions.style.display = 'none';

        let fileName = "Credit_Vault_Loan_Profile.pdf";
        if (currentLoan) {
            const cleanName = (currentLoan.borrower_name || 'Customer').replace(/[^a-zA-Z0-9]/g, '_');
            const cleanId = (currentLoan.loan_id || 'Loan').replace(/[^a-zA-Z0-9]/g, '_');
            fileName = `${cleanName}_${cleanId}.pdf`;
        }

        const opt = {
            margin:       10,
            filename:     fileName,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().from(element).set(opt).save().then(() => {
            actions.style.display = 'flex';
        });
    }

    function closeModal() {
        document.getElementById('loanModal').style.display = 'none';
    }

    function handleLogout() {
        sessionStorage.clear();
        localStorage.removeItem('velfincorp_logged_user');
        window.location.replace('login.html');
    }
</script>

</body>
</html>
