<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vel Fin Corp - Retailer Details Registration</title>
    <style>
        :root {
            --primary-navy: #0B1D3A;
            --accent-gold: #C5A059;
            --bg-light: #F4F6F9;
            --text-dark: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(11, 29, 58, 0.1);
            border-top: 5px solid var(--primary-navy);
        }
        h2 {
            text-align: center;
            color: var(--primary-navy);
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-navy);
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus, select:focus {
            border-color: var(--accent-gold);
            outline: none;
        }
        .btn-submit {
            background-color: var(--primary-navy);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-submit:hover {
            background-color: var(--accent-gold);
            color: var(--primary-navy);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>VEL FIN CORP</h2>
    <h3 style="text-align: center; color: var(--accent-gold); margin-top: -15px; margin-bottom: 25px;">Retailer Details Registration</h3>

    <form id="retailerForm" onsubmit="return validateRetailer(event)">
        
        <div class="form-group">
            <label>Show Room Name *</label>
            <input type="text" id="Show_Room_Name" oninput="generateRetailerCode()" required>
        </div>

        <div class="form-group">
            <label>Retailer Code (Auto-generated)</label>
            <input type="text" id="Retailer_Code" readonly>
        </div>

        <div class="form-group">
            <label>Owner Name *</label>
            <input type="text" id="Owner_Name" required>
        </div>

        <div class="form-group">
            <label>WhatsApp Number *</label>
            <input type="text" id="WhatsApp_Number" maxlength="10" placeholder="10 digit number" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="Email">
        </div>

        <div class="form-group">
            <label>City / Location *</label>
            <input type="text" id="City_Location" oninput="generateRetailerCode()" required>
        </div>

        <div class="form-group">
            <label>GST #</label>
            <input type="text" id="GST">
        </div>

        <div class="form-group">
            <label>PAN NUMBER</label>
            <input type="text" id="PAN_NUMBER" maxlength="10">
        </div>

        <div class="form-group">
            <label>Aadhar Number</label>
            <input type="text" id="Aadhar_Number" maxlength="12">
        </div>

        <div class="form-group">
            <label>Account Holder Name</label>
            <input type="text" id="Account_Holder_Name">
        </div>

        <div class="form-group">
            <label>Bank & Branch Name</label>
            <input type="text" id="Bank_Branch_Name">
        </div>

        <div class="form-group">
            <label>Bank Account Number</label>
            <input type="password" id="Bank_Account_Number">
        </div>

        <div class="form-group">
            <label>Confirm Bank Account Number</label>
            <input type="text" id="Confirm_Bank_Account_Number">
        </div>

        <div class="form-group">
            <label>IFSC CODE</label>
            <input type="text" id="IFSC_CODE" maxlength="11">
        </div>

        <button type="submit" class="btn-submit">Submit Retailer Details</button>
    </form>
</div>

<script>
    // Retailer Code Auto Generation Logic mirroring Zoho Deluge
    function generateRetailerCode() {
        let sname = document.getElementById('Show_Room_Name').value.trim();
        let loc = document.getElementById('City_Location').value.trim();
        let showInit = "";
        let locInit = "";

        if (sname.length > 0) {
            let cleanedName = sname.replace(/&/g, "and");
            let words = cleanedName.split(" ");
            let count = 0;
            for (let i = 0; i < words.length; i++) {
                if (words[i].length > 0 && count < 2) {
                    showInit += words[i].substring(0, 1).toUpperCase();
                    count++;
                }
            }
        }

        if (loc.length > 0) {
            locInit = loc.substring(0, 1).toUpperCase();
        }

        let finalCode = "";
        if (locInit !== "" && showInit !== "") {
            finalCode = locInit + showInit;
        } else if (showInit !== "") {
            finalCode = showInit;
        } else if (locInit !== "") {
            finalCode = locInit;
        }

        document.getElementById('Retailer_Code').value = finalCode;
    }

    function validateRetailer(event) {
        const acc = document.getElementById('Bank_Account_Number').value;
        const confirmAcc = document.getElementById('Confirm_Bank_Account_Number').value;

        if (acc !== "" && confirmAcc !== "" && acc !== confirmAcc) {
            alert("வங்கிக் கணக்கு எண்கள் இரண்டும் ஒன்றாக இல்லை!");
            event.preventDefault();
            return false;
        }

        alert("Retailer details validated and submitted successfully!");
        return true;
    }
</script>

</body>
</html>
