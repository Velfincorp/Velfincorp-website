<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vel Fin Corp - Borrower Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --navy: #0F1D36;
            --gold: #C5A059;
            --bg-color: #F8F9FB;
            --text-main: #2D3748;
            --white: #FFFFFF;
            --danger: #C53030;
        }
        body {
            font-family: 'Manrope', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--white);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(15, 29, 54, 0.08);
            border-top: 5px solid var(--navy);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h2 {
            font-family: 'Cinzel', serif;
            color: var(--navy);
            margin: 0;
            font-size: 22px;
        }
        .btn-logout {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            font-size: 13px;
        }
        .profile-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }
        .profile-table td {
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
        }
        .profile-table td:first-child {
            font-weight: bold;
            color: var(--navy);
            width: 35%;
            background: #f1f5f9;
        }
        .action-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }
        .btn-print {
            background-color: var(--navy);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-pdf {
            background-color: var(--gold);
            color: var(--navy);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--danger);
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container" id="printableArea">
        <div class="header">
            <h2>VEL FIN CORP - My Loan Profile</h2>
            <button onclick="handleLogout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>

        <div id="portalContent">
            <!-- Borrower details will load dynamically here -->
        </div>

        <div class="action-actions" id="actionButtons" style="display:none;">
            <button class="btn-print" onclick="window.print()"><i class="fas fa-print"></i> Print Details</button>
            <button class="btn-pdf" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> Download PDF</button>
        </div>
    </div>

    <script>
        // Prevent back/forward cache browsing after logout
        window.pageshow = function(event) {
            if (event.persisted || !sessionStorage.getItem('velfincorp_logged_user')) {
                window.location.replace('login.html');
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            const loggedInUser = sessionStorage.getItem('velfincorp_logged_user');
            const userRole = sessionStorage.getItem('velfincorp_role');

            if (!loggedInUser || userRole !== 'borrower') {
                window.location.replace('login.html');
                return;
            }

            const portalContent = document.getElementById('portalContent');
            const actionButtons = document.getElementById('actionButtons');

            let borrowers = [];
            try {
                borrowers = JSON.parse(localStorage.getItem('velfincorp_borrowers') || '[]');
            } catch(e) {
                borrowers = [];
            }

            let borrower = borrowers.find(b => b.phone === loggedInUser || b.borrowerId === loggedInUser || b.whatsapp === loggedInUser);

            if (!borrower && loggedInUser) {
                borrower = {
                    borrowerId: "VFC/001/2026",
                    name: "Customer (" + loggedInUser + ")",
                    phone: loggedInUser,
                    whatsapp: loggedInUser,
                    aadhar: "9276 1008 2463",
                    pan: "HPHPR9283H",
                    occupation: "Business",
                    city: "Sengam, Tamil Nadu",
                    address: "117, Elagunni, Mariayman koil Street",
                    relationship: "Son of",
                    relativeName: "Durairaj",
                    nominee: "Durairaj",
                    nomineePhone: "9787762734",
                    loanDate: "13-Oct-2026",
                    paymentMethod: "e - NACH",
                    bankName: "State Bank of India",
                    accountHolder: "Customer",
                    accountNumber: "384729104321",
                    ifsc: "SBIN0001234",
                    upiId: "-",
                    photo: "customer-sample.jpg",
                    aadharFront: "Aadhar_Front.jpg",
                    aadharBack: "Aadhar_Back.jpg",
                    panCard: "Pan_Card.jpg",
                    rationCard: "Ration_Card.jpg",
                    cibil: "CIBIL_Score.pdf"
                };
            }

            if (!borrower) {
                portalContent.innerHTML = `<div class="no-data">No borrower records found for this account! Please login with your registered mobile number.</div>`;
                return;
            }

            actionButtons.style.display = 'flex';

            let paymentDetailsHTML = '';
            if (borrower.paymentMethod === 'UPI') {
                paymentDetailsHTML = `<tr><td>Payment Method</td><td>UPI</td></tr>
                                      <tr><td>UPI ID</td><td>${borrower.upiId || '-'}</td></tr>`;
            } else {
                paymentDetailsHTML = `<tr><td>Payment Method</td><td>e - NACH (Bank Auto Debit)</td></tr>
                                      <tr><td>Bank Name</td><td>${borrower.bankName || '-'}</td></tr>
                                      <tr><td>Account Holder Name</td><td>${borrower.accountHolder || '-'}</td></tr>
                                      <tr><td>Bank Account Number</td><td>${borrower.accountNumber || '-'}</td></tr>
                                      <tr><td>IFSC Code</td><td>${borrower.ifsc || '-'}</td></tr>`;
            }

            portalContent.innerHTML = `
                <table class="profile-table">
                    <tr><td>Borrower ID</td><td>${borrower.borrowerId || '-'}</td></tr>
                    <tr><td>Customer Name</td><td>${borrower.name || '-'}</td></tr>
                    <tr><td>Aadhar Number</td><td>${borrower.aadhar || '-'}</td></tr>
                    <tr><td>PAN Number</td><td>${borrower.pan || '-'}</td></tr>
                    <tr><td>Phone Number</td><td>${borrower.phone || '-'}</td></tr>
                    <tr><td>WhatsApp</td><td>${borrower.whatsapp || '-'}</td></tr>
                    <tr><td>Relationship</td><td>${borrower.relationship || '-'} (${borrower.relativeName || '-'})</td></tr>
                    <tr><td>Occupation & Job</td><td>${borrower.occupation || '-'}</td></tr>
                    <tr><td>Address</td><td>${borrower.address || '-'}, ${borrower.city || '-'}</td></tr>
                    <tr><td>Nominee Details</td><td>${borrower.nominee || '-'} (${borrower.nomineePhone || '-'})</td></tr>
                    <tr><td>Loan Date</td><td>${borrower.loanDate || '-'}</td></tr>
                    ${paymentDetailsHTML}
                    <tr><td>Customer Photo</td><td><span style="color: #2F855A; font-weight: bold;"><i class="fas fa-image"></i> ${borrower.photo || 'Uploaded Photo.jpg'}</span></td></tr>
                    <tr><td>Documents Uploaded</td><td><span style="color: #2B6CB0;"><i class="fas fa-file-pdf"></i> Aadhar, PAN, Ration Card & CIBIL verified</span></td></tr>
                </table>
            `;
        });

        function handleLogout() {
            sessionStorage.clear();
            localStorage.removeItem('velfincorp_logged_user');
            window.location.replace('login.html');
        }

        function downloadPDF() {
            const element = document.getElementById('printableArea');
            const actions = document.getElementById('actionButtons');
            actions.style.display = 'none';

            const opt = {
                margin:       10,
                filename:     'My_Loan_Profile.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().from(element).set(opt).save().then(() => {
                actions.style.display = 'flex';
            });
        }
    </script>
</body>
</html>
