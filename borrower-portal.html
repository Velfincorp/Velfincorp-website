<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Vel Fin Corp - Borrower Portal</title>
    <link rel="icon" type="image/jpeg" href="velfincorp-logo.jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    <script src="db.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --navy: #0F1D36; --gold: #C5A059; --bg-color: #F8F9FB; --text-main: #2D3748; --white: #FFFFFF; --danger: #C53030; --success: #2F855A; }
        body { font-family: 'Manrope', Arial, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; background: var(--white); padding: 32px; border-radius: 8px; box-shadow: 0 4px 20px rgba(15, 29, 54, 0.08); border-top: 5px solid var(--navy); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); padding-bottom: 15px; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
        .header h2 { font-family: 'Cinzel', serif; color: var(--navy); margin: 0; font-size: 20px; }
        .btn-logout { background-color: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .welcome { margin-bottom: 20px; }
        .welcome .name { font-size: 20px; font-weight: 800; color: var(--navy); }
        .welcome .sub { font-size: 13px; color: #64748b; margin-top: 3px; }
        .loan-card { border: 1px solid #cbd5e1; border-radius: 8px; padding: 20px; margin-bottom: 25px; background: #fff; }
        .loan-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .loan-title .id { font-family: 'Cinzel', serif; font-size: 17px; font-weight: 700; color: var(--navy); }
        .loan-title .prod { font-size: 13px; color: #64748b; margin-top: 3px; }
        .badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; color: #fff; }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .summary-card { background: #f1f5f9; padding: 14px; border-radius: 6px; border-left: 4px solid var(--gold); text-align: center; }
        .summary-card h4 { margin: 0 0 6px 0; font-size: 11px; color: #64748b; text-transform: uppercase; }
        .summary-card .value { font-size: 17px; font-weight: 800; color: var(--navy); }
        .progress-wrap { margin: 5px 0 18px 0; }
        .progress-label { font-size: 12px; font-weight: 700; color: var(--navy); margin-bottom: 5px; display: flex; justify-content: space-between; }
        .progress-bar { background: #e2e8f0; height: 10px; border-radius: 6px; overflow: hidden; }
        .progress-fill { background: var(--success); height: 100%; }
        .payment-box { background: #fffbeb; border: 1px solid #f59e0b; padding: 18px; border-radius: 8px; margin-bottom: 18px; text-align: center; }
        .payment-box.late { background: #fef2f2; border-color: #fca5a5; }
        .payment-box h4 { margin: 0 0 6px 0; color: var(--navy); font-family: 'Cinzel', serif; }
        .payment-box p { font-size: 13px; color: #475569; margin: 5px 0; }
        .btn-pay { background-color: var(--success); color: white; border: none; padding: 11px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; text-decoration: none; display: inline-block; margin-top: 8px; }
        .btn-pay:hover { background-color: #276749; }
        .hist-title { font-family: 'Cinzel', serif; font-weight: 700; color: var(--navy); margin: 5px 0 8px 0; font-size: 14px; }
        table.hist { width: 100%; border-collapse: collapse; font-size: 13px; }
        table.hist th { background: var(--navy); color: #fff; padding: 8px; text-align: center; }
        table.hist td { border: 1px solid #cbd5e1; padding: 8px; text-align: center; }
        .action-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; }
        .btn-print { background-color: var(--navy); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-pdf { background-color: var(--gold); color: var(--navy); border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .no-data { text-align: center; padding: 40px 10px; color: #475569; font-size: 15px; line-height: 1.7; }
        .no-data.error { color: var(--danger); font-weight: bold; }
        .loading { text-align: center; padding: 40px; color: #64748b; }
        .upi-alt { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #e2c98f; }
        .app-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
        .app-btn { background: #fff; border: 1px solid #cbd5e1; color: var(--navy); padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 700; text-decoration: none; }
        .app-btn:hover { border-color: var(--gold); background: #fffbeb; }
        .qr-box { display: inline-block; padding: 8px; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; margin: 4px 0; }
        .upi-text { font-size: 12.5px; color: #475569; line-height: 1.8; }
        .copy-btn { background: var(--navy); color: #fff; border: none; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; }
        @media print { .btn-logout, .action-actions, .btn-pay, .upi-alt { display: none !important; } body { padding: 0; } .container { box-shadow: none; } }
    </style>
</head>
<body>

    <div class="container" id="printableArea">
        <div class="header">
            <h2>VEL FIN CORP - Secure Borrower Portal</h2>
            <button onclick="handleLogout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>

        <div id="portalContent"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading your account...</div></div>

        <div class="action-actions" id="actionButtons" style="display:none;">
            <button class="btn-print" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
            <button class="btn-pdf" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> Download PDF</button>
        </div>
    </div>

    <script>
        /* >>> Confirm this is your real UPI ID <<< */
        const UPI_ID = 'velfincorp@sbi';
        const PAYEE_NAME = 'VEL FIN CORP';

        window.addEventListener('pageshow', function(event) {
            if (event.persisted || !sessionStorage.getItem('velfincorp_logged_user')) {
                window.location.replace('login.html');
            }
        });

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function rupees(n) {
            return '₹' + (Number(n) || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function normText(v) { return String(v || '').trim().toLowerCase(); }

        function parseFlexibleDate(dateInput) {
            if (!dateInput) return new Date();
            if (dateInput instanceof Date) return new Date(dateInput.getFullYear(), dateInput.getMonth(), dateInput.getDate());
            const str = String(dateInput).trim().split('T')[0];
            const parts = str.split(/[-\/]/);
            if (parts.length === 3) {
                if (parts[0].length === 4) return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
            }
            const fb = new Date(dateInput);
            return isNaN(fb.getTime()) ? new Date() : new Date(fb.getFullYear(), fb.getMonth(), fb.getDate());
        }
        function formatIndianDate(dateInput) {
            if (!dateInput) return '-';
            const d = parseFlexibleDate(dateInput);
            return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
        }
        function computeInstallmentDueDate(loanStart, loanType, n) {
            const d = parseFlexibleDate(loanStart);
            const t = String(loanType || 'Weekly').toLowerCase();
            if (t.includes('daily')) d.setDate(d.getDate() + n);
            else if (t.includes('monthly')) d.setMonth(d.getMonth() + n);
            else d.setDate(d.getDate() + (n * 7));
            return d;
        }

        // A payment belongs to a loan only if the Loan ID AND the borrower match
        function paymentBelongsToLoan(p, loan) {
            if (!p.loan_id || p.loan_id !== loan.loan_id) return false;
            const pName = normText(p.borrower_name || p.customer_name || p.full_name);
            if (pName) return pName === normText(loan.borrower_name);
            return true;
        }

        function summarizeLoan(loan, loanPayments) {
            const emi = parseFloat(loan.installment_amount || 0);
            let tenure = 10;
            const m = String(loan.tenure || '').match(/\d+/);
            if (m) tenure = parseInt(m[0]);
            const total = parseFloat(loan.loan_amount || 0);
            const paid = loanPayments.reduce((s, p) => s + parseFloat(p.amount_paid || p.paid_amount || p.amount || 0), 0);
            const remaining = Math.max(0, total - paid);
            const paidInst = emi > 0 ? Math.min(tenure, Math.floor((paid + 0.01) / emi)) : loanPayments.length;

            let state = 'ACTIVE', label = 'ACTIVE', color = '#2B6CB0', dueDate = null, delayDays = 0;
            let missed = 0, shortfall = 0, penalty = 0;
            if (loan.status === 'CLOSED') {
                state = 'CLOSED'; label = 'CLOSED'; color = '#64748b';
            } else if ((total > 0 && paid >= total) || paidInst >= tenure) {
                state = 'COMPLETED'; label = 'FULLY PAID'; color = '#2F855A';
            } else {
                dueDate = computeInstallmentDueDate(loan.loan_date || loan.$createdAt, loan.loan_type, paidInst + 1);
                const today = parseFlexibleDate(new Date());
                delayDays = Math.round((today - dueDate) / 86400000);
                if (delayDays > 0) { label = 'OVERDUE'; color = '#C53030'; }
                else { label = 'ON TIME'; color = '#2F855A'; }

                // missed installments, overdue amount and one-time late fee per missed installment
                const isDaily = String(loan.loan_type || '').toLowerCase().includes('daily');
                const step = isDaily ? 1 : 7;
                const start = parseFlexibleDate(loan.loan_date || loan.$createdAt);
                const diffFromStart = Math.round((today - start) / 86400000);
                const dueCount = Math.max(0, Math.min(tenure, Math.ceil(diffFromStart / step) - 1));
                missed = Math.max(0, dueCount - paidInst);
                shortfall = Math.min(remaining, Math.max(0, dueCount * emi - paid));
                const perPenalty = isDaily ? Math.min(Math.round(emi * 0.10), 75) : 295;
                penalty = missed * perPenalty;
            }
            const baseDue = (delayDays > 0 && shortfall > 0) ? shortfall : (emi > 0 ? emi : remaining);
            const payNow = Math.round(Math.min(baseDue, remaining) * 100) / 100;
            return { emi, tenure, total, paid, remaining, paidInst, state, label, color, dueDate, delayDays, payNow, missed, shortfall, penalty };
        }

        function renderLoanCard(loan, loanPayments, multiNames) {
            const s = summarizeLoan(loan, loanPayments);
            const sorted = loanPayments.slice().sort((a, b) => parseFlexibleDate(a.payment_date || a.$createdAt) - parseFlexibleDate(b.payment_date || b.$createdAt));
            const percent = s.tenure > 0 ? Math.min(100, Math.round((s.paidInst / s.tenure) * 100)) : 0;
            const product = [loan.loan_category, loan.product_name].filter(Boolean).join(' - ');
            const typeText = (loan.loan_type || 'Weekly') + ' | ' + (loan.tenure || (s.tenure + ' installments'));

            let payBox = '';
            if (s.state === 'ACTIVE' && loan.status === 'ACTIVE' && s.remaining > 0 && s.payNow > 0) {
                const note = encodeURIComponent('EMI ' + loan.loan_id);
                const q = `pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent(PAYEE_NAME)}&am=${s.payNow.toFixed(2)}&cu=INR&tn=${note}`;
                const url = 'upi://pay?' + q;
                const gpay = 'tez://upi/pay?' + q;
                const phonepe = 'phonepe://pay?' + q;
                const paytm = 'paytmmp://pay?' + q;
                const late = s.delayDays > 0;
                payBox = `
                    <div class="payment-box ${late ? 'late' : ''}">
                        <h4><i class="fas fa-shield-alt"></i> ${late ? 'Overdue EMI' : 'Next EMI'}</h4>
                        <p>Installment ${s.paidInst + 1} of ${s.tenure} &nbsp;|&nbsp; Due date: <strong>${formatIndianDate(s.dueDate)}</strong>
                           ${late ? `<br><span style="color:#C53030; font-weight:800;">${s.delayDays} day${s.delayDays === 1 ? '' : 's'} overdue</span>` : ''}
                           ${late && s.missed > 0 ? `<br>Missed installments: <strong>${s.missed}</strong> &nbsp;|&nbsp; Overdue amount: <strong>${rupees(s.shortfall)}</strong> &nbsp;|&nbsp; Late fee: <strong style="color:#C53030;">${rupees(s.penalty)}</strong>
                           <br><span style="font-size:12px; color:#64748b;">The late fee is payable separately - please contact Vel Fin Corp.</span>` : ''}</p>
                        <a href="${esc(url)}" class="btn-pay"><i class="fas fa-rupee-sign"></i> Pay ${rupees(s.payNow)} via UPI</a>
                        <div class="upi-alt">
                            <div class="app-row">
                                <a href="${esc(gpay)}" class="app-btn">Google Pay</a>
                                <a href="${esc(phonepe)}" class="app-btn">PhonePe</a>
                                <a href="${esc(paytm)}" class="app-btn">Paytm</a>
                            </div>
                            <div class="qr-box" data-upi="${esc(url)}"></div>
                            <p class="upi-text">Using a computer? Scan this QR code with any UPI app on your phone.<br>
                                Or pay manually: UPI ID <strong>${esc(UPI_ID)}</strong> <button type="button" class="copy-btn" onclick="copyUpiId()">Copy</button>
                                &nbsp;|&nbsp; Amount <strong>${rupees(s.payNow)}</strong> &nbsp;|&nbsp; Note: <strong>EMI ${esc(loan.loan_id)}</strong></p>
                        </div>
                        <p style="font-size:12px;">After you pay, the payment appears below once Vel Fin Corp records it.</p>
                    </div>`;
            }

            let rows = '';
            if (sorted.length) {
                sorted.forEach((p, i) => {
                    const late = p.delayed_details && p.delayed_details !== 'On Time';
                    rows += `<tr>
                        <td>${esc(p.paid_installment || (i + 1))}</td>
                        <td>${esc(p.payment_id || '-')}</td>
                        <td>${formatIndianDate(p.payment_date || p.$createdAt)}</td>
                        <td style="font-weight:700; color:#2F855A;">${rupees(p.amount_paid)}</td>
                        <td>${esc(p.payment_mode || '-')}</td>
                        <td style="font-weight:700; color:${late ? '#C53030' : '#2F855A'};">${esc(p.delayed_details || 'On Time')}</td>
                    </tr>`;
                });
            } else {
                rows = `<tr><td colspan="6" style="color:#64748b;">No payments recorded yet.</td></tr>`;
            }

            return `
                <div class="loan-card">
                    <div class="loan-title">
                        <div>
                            <div class="id">${esc(loan.loan_id || '-')}</div>
                            <div class="prod">${esc(product || 'Loan')} &nbsp;|&nbsp; ${esc(typeText)}${multiNames ? ' &nbsp;|&nbsp; ' + esc(loan.borrower_name) : ''}</div>
                            <div class="prod">Started on ${formatIndianDate(loan.loan_date || loan.$createdAt)}</div>
                        </div>
                        <span class="badge" style="background:${s.color};">${s.label}</span>
                    </div>
                    <div class="summary-grid">
                        <div class="summary-card"><h4>Total Payable</h4><div class="value">${rupees(s.total)}</div></div>
                        <div class="summary-card"><h4>EMI</h4><div class="value" style="color:#2F855A;">${rupees(s.emi)}</div></div>
                        <div class="summary-card"><h4>Paid So Far</h4><div class="value" style="color:#2F855A;">${rupees(s.paid)}</div></div>
                        <div class="summary-card"><h4>Balance</h4><div class="value" style="color:#C53030;">${rupees(s.remaining)}</div></div>
                    </div>
                    <div class="progress-wrap">
                        <div class="progress-label"><span>Installments paid: ${s.paidInst} / ${s.tenure}</span><span>${percent}%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:${percent}%;"></div></div>
                    </div>
                    ${payBox}
                    <div class="hist-title">Payment History</div>
                    <div style="overflow-x:auto;">
                        <table class="hist">
                            <thead><tr><th>Inst #</th><th>Receipt ID</th><th>Date</th><th>Amount</th><th>Mode</th><th>Status</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                </div>`;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const loggedInUser = sessionStorage.getItem('velfincorp_logged_user');
            const userRole = sessionStorage.getItem('velfincorp_role');
            if (!loggedInUser || userRole !== 'borrower') {
                window.location.replace('login.html');
                return;
            }

            const portalContent = document.getElementById('portalContent');
            try {
                const borrowers = await window.vfcFindBorrowersByMobile(loggedInUser);
                if (!borrowers.length) {
                    portalContent.innerHTML = `<div class="no-data error">No borrower account found for this mobile number.<br><span style="font-weight:500; color:#475569;">Please contact Vel Fin Corp support.</span></div>`;
                    return;
                }

                // every number this customer is registered with
                const numbers = Array.from(new Set(
                    [loggedInUser]
                        .concat(borrowers.flatMap(b => [b.phone_number, b.whatsapp_number]))
                        .map(n => window.vfcLast10(n))
                        .filter(Boolean)
                ));

                let loans = [], payments = [];
                for (const n of numbers) {
                    const l = await window.vfcQueryEqualOrAll(VFC_DB.LOANS_ID, 'phone_number', n, x => window.vfcLast10(x.phone_number) === n);
                    const p = await window.vfcQueryEqualOrAll(VFC_DB.PAYMENTS_ID, 'phone_number', n, x => window.vfcLast10(x.phone_number) === n);
                    loans = loans.concat(l);
                    payments = payments.concat(p);
                }
                const uniq = arr => { const seen = new Set(); return arr.filter(d => seen.has(d.$id) ? false : (seen.add(d.$id), true)); };
                loans = uniq(loans);
                payments = uniq(payments);

                // ACTIVE first, then newest first
                loans.sort((a, b) => {
                    const aa = a.status === 'ACTIVE' ? 0 : 1, bb = b.status === 'ACTIVE' ? 0 : 1;
                    if (aa !== bb) return aa - bb;
                    return parseFlexibleDate(b.loan_date || b.$createdAt) - parseFlexibleDate(a.loan_date || a.$createdAt);
                });

                const names = Array.from(new Set(borrowers.map(b => b.full_name).filter(Boolean)));
                const ids = Array.from(new Set(borrowers.map(b => b.borrower_id).filter(Boolean)));
                const multiNames = names.length > 1;

                let html = `
                    <div class="welcome">
                        <div class="name">Welcome, ${esc(names.join(' / '))}</div>
                        <div class="sub">Borrower ID: ${esc(ids.join(', ') || '-')} &nbsp;|&nbsp; Mobile: ${esc(loggedInUser)}</div>
                    </div>`;

                if (!loans.length) {
                    html += `<div class="no-data">You do not have any loan on this account yet.</div>`;
                } else {
                    loans.forEach(loan => {
                        const lp = payments.filter(p => paymentBelongsToLoan(p, loan));
                        html += renderLoanCard(loan, lp, multiNames);
                    });
                }

                portalContent.innerHTML = html;
                renderQRCodes();
                document.getElementById('actionButtons').style.display = 'flex';
            } catch (err) {
                console.error("Borrower portal error:", err);
                portalContent.innerHTML = `<div class="no-data error">Could not load your account right now.<br><span style="font-weight:500;">${esc(err.message)}</span></div>`;
            }
        });

        function renderQRCodes() {
            if (typeof QRCode === 'undefined') return;
            document.querySelectorAll('.qr-box').forEach(el => {
                if (el.dataset.done) return;
                el.dataset.done = '1';
                new QRCode(el, { text: el.dataset.upi, width: 150, height: 150 });
            });
        }

        function copyUpiId() {
            const done = () => alert('UPI ID copied: ' + UPI_ID);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(UPI_ID).then(done).catch(() => prompt('Copy this UPI ID:', UPI_ID));
            } else {
                prompt('Copy this UPI ID:', UPI_ID);
            }
        }

        function handleLogout() {
            sessionStorage.clear();
            localStorage.removeItem('velfincorp_logged_user');
            window.location.replace('login.html');
        }

        function downloadPDF() {
            const element = document.getElementById('printableArea');
            const actions = document.getElementById('actionButtons');
            actions.style.display = 'none';

            const opt = {
                margin: 10,
                filename: 'Vel_Fin_Corp_Account_Statement.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().from(element).set(opt).save().then(() => {
                actions.style.display = 'flex';
            });
        }
    </script>
</body>
</html>
