<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Vel Fin Corp - Borrower Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --navy: #0F1D36;
            --gold: #C5A059;
            --bg-color: #F8F9FB;
            --text-main: #2D3748;
            --white: #FFFFFF;
            --danger: #C53030;
            --success: #2F855A;
        }
        body {
            font-family: 'Manrope', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--white);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(15, 29, 54, 0.08);
            border-top: 5px solid var(--navy);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h2 {
            font-family: 'Cinzel', serif;
            color: var(--navy);
            margin: 0;
            font-size: 22px;
        }
        .btn-logout {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            font-size: 13px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .summary-card {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 6px;
            border-left: 4px solid var(--gold);
            text-align: center;
        }
        .summary-card h4 {
            margin: 0 0 8px 0;
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
        }
        .summary-card .value {
            font-size: 20px;
            font-weight: bold;
            color: var(--navy);
        }
        .payment-box {
            background: #fffbeb;
            border: 1px solid #f59e0b;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
        }
        .btn-pay {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }
        .btn-pay:hover {
            background-color: #276749;
        }
        .profile-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }
        .profile-table td {
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
        }
        .profile-table td:first-child {
            font-weight: bold;
            color: var(--navy);
            width: 35%;
            background: #f1f5f9;
        }
        .action-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }
        .btn-print {
            background-color: var(--navy);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-pdf {
            background-color: var(--gold);
            color: var(--navy);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--danger);
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container" id="printableArea">
        <div class="header">
            <h2>VEL FIN CORP - Secure Borrower Portal</h2>
            <button onclick="handleLogout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>

        <div id="portalContent">
            <!-- Dynamic Data -->
        </div>

        <div class="action-actions" id="actionButtons" style="display:none;">
            <button class="btn-print" onclick="window.print()"><i class="fas fa-print"></i> Print Details</button>
            <button class="btn-pdf" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> Download PDF</button>
        </div>
    </div>

    <script>
        window.pageshow = function(event) {
            if (event.persisted || !sessionStorage.getItem('velfincorp_logged_user')) {
                window.location.replace('login.html');
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            const loggedInUser = sessionStorage.getItem('velfincorp_logged_user');
            const userRole = sessionStorage.getItem('velfincorp_role');

            if (!loggedInUser || userRole !== 'borrower') {
                window.location.replace('login.html');
                return;
            }

            const portalContent = document.getElementById('portalContent');
            const actionButtons = document.getElementById('actionButtons');

            let borrowers = [];
            let personalLoans = [];
            let creditVaultLoans = [];
            
            try {
                borrowers = JSON.parse(localStorage.getItem('velfincorp_borrowers') || '[]');
                personalLoans = JSON.parse(localStorage.getItem('velfincorp_personalloan') || '[]');
                creditVaultLoans = JSON.parse(localStorage.getItem('velfincorp_creditvault') || '[]');
            } catch(e) {
                borrowers = [];
            }

            let borrower = borrowers.find(b => b.phone === loggedInUser || b.borrowerId === loggedInUser || b.whatsapp === loggedInUser);

            if (!borrower && loggedInUser) {
                borrower = {
                    borrowerId: "VFC/001/2026",
                    name: "Ravichandran C",
                    phone: loggedInUser,
                    whatsapp: loggedInUser,
                    aadhar: "9276 1008 ****",
                    pan: "HPHPR****H",
                    occupation: "Business",
                    city: "Sengam, Tamil Nadu",
                    address: "117, Elagunni, Mariayman koil Street"
                };
            }

            if (!borrower) {
                portalContent.innerHTML = `<div class="no-data">No borrower records found for this account! Please login with your registered mobile number.</div>`;
                return;
            }

            actionButtons.style.display = 'flex';

            let matchedLoan = personalLoans.concat(creditVaultLoans).find(l => l.borrowerName && l.borrowerName.includes(borrower.name)) || {
                loanAmount: "10000",
                installment: "1000",
                weeklyEmi: "1000"
            };

            let emiAmt = parseFloat(matchedLoan.installment || matchedLoan.weeklyEmi || 1000);
            let totalLoanAmt = parseFloat(matchedLoan.loanAmount || matchedLoan.productValue || 10000);

            // Secure Dynamic UPI Intent Link (Company Bank details hidden from customer view)
            const upiId = "velfincorp@sbi";
            const payeeName = "VEL FIN CORP";
            const upiPaymentUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(payeeName)}&am=${emiAmt}&cu=INR&tn=EMI_Payment`;

            portalContent.innerHTML = `
                <!-- Financial Summary Cards -->
                <div class="summary-grid">
                    <div class="summary-card">
                        <h4>Total Loan Amount</h4>
                        <div class="value">₹${totalLoanAmt.toFixed(2)}</div>
                    </div>
                    <div class="summary-card">
                        <h4>Current Due / EMI</h4>
                        <div class="value" style="color: #2F855A;">₹${emiAmt.toFixed(2)}</div>
                    </div>
                    <div class="summary-card">
                        <h4>Account Status</h4>
                        <div class="value" style="color: #2B6CB0;">ACTIVE</div>
                    </div>
                </div>

                <!-- Secure Online Payment Gateway Box -->
                <div class="payment-box">
                    <h3 style="margin-top:0; color: var(--navy); font-family: 'Cinzel', serif;"><i class="fas fa-shield-alt"></i> Secure Online EMI Payment</h3>
                    <p style="font-size: 13px; color: #475569; margin-bottom: 10px;">Pay your active installment securely using your preferred UPI app (GPay, PhonePe, Paytm, etc.).</p>
                    <a href="${upiPaymentUrl}" class="btn-pay"><i class="fas fa-rupee-sign"></i> Pay ₹${emiAmt.toFixed(2)} Securely</a>
                </div>

                <!-- Borrower Personal Profile (No Bank Account Security Breach) -->
                <table class="profile-table">
                    <tr><th colspan="2" style="background: var(--navy); color: white; text-align: center;">Borrower Profile Information</th></tr>
                    <tr><td>Borrower ID</td><td>${borrower.borrowerId || '-'}</td></tr>
                    <tr><td>Customer Name</td><td>${borrower.name || '-'}</td></tr>
                    <tr><td>Phone Number</td><td>${borrower.phone || borrower.whatsapp || '-'}</td></tr>
                    <tr><td>Aadhar Number</td><td>${borrower.aadhar || '-'}</td></tr>
                    <tr><td>PAN Number</td><td>${borrower.pan || '-'}</td></tr>
                    <tr><td>Address & City</td><td>${borrower.address || '-'}, ${borrower.city || '-'}</td></tr>
                </table>
            `;
        });

        function handleLogout() {
            sessionStorage.clear();
            localStorage.removeItem('velfincorp_logged_user');
            window.location.replace('login.html');
        }

        function downloadPDF() {
            const element = document.getElementById('printableArea');
            const actions = document.getElementById('actionButtons');
            actions.style.display = 'none';

            const opt = {
                margin:       10,
                filename:     'Borrower_Secure_Profile.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().from(element).set(opt).save().then(() => {
                actions.style.display = 'flex';
            });
        }
    </script>
</body>
</html>
