<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vel Fin Corp - Borrower Registration & Loan Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0f1d36;
            --gold: #c5a059;
            --red: #b33939;
            --bg-color: #f8f9fb;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --border-color: #cbd5e1;
        }
        body {
            font-family: 'Manrope', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .form-container {
            max-width: 850px;
            background: var(--card-bg);
            margin: 0 auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(15, 29, 54, 0.08);
            border-top: 5px solid var(--gold);
        }
        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            color: var(--navy);
            margin: 0;
            letter-spacing: 1px;
        }
        .brand-tagline {
            font-size: 12px;
            color: var(--red);
            font-weight: 700;
            letter-spacing: 3px;
            margin-top: 5px;
            text-transform: uppercase;
        }
        h2 {
            color: var(--navy);
            text-align: center;
            font-size: 20px;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
        }
        fieldset {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            background-color: #fff;
        }
        legend {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            color: var(--navy);
            background: #f1f5f9;
            padding: 6px 18px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
        }
        .form-col {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--navy);
            font-size: 13px;
        }
        input, select, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fff;
            transition: all 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
        }
        .submit-btn {
            background-color: var(--navy);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s, transform 0.2s;
            letter-spacing: 1px;
        }
        .submit-btn:hover {
            background-color: #1a325c;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="brand-header">
        <h1 class="brand-title">VEL FIN CORP</h1>
        <div class="brand-tagline">Trust &bull; Finance &bull; Prosperity</div>
    </div>

    <h2>Borrower Registration & Loan Application</h2>

    <form action="#" method="POST" enctype="multipart/form-data">
        
        <!-- Basic Info -->
        <fieldset>
            <legend>Basic Info & Roles</legend>
            
            <div class="form-row">
                <div class="form-col">
                    <label for="issued_by">Issued By (Role) *</label>
                    <select id="issued_by" name="issued_by" required>
                        <option value="">-Select Role-</option>
                        <option value="Admin">Admin</option>
                        <option value="Office Staff">Office Staff</option>
                        <option value="Retailer">Retailer / Partner</option>
                    </select>
                </div>
                <div class="form-col">
                    <label for="borrower_id">Borrower ID *</label>
                    <input type="text" id="borrower_id" name="borrower_id" placeholder="VFC-2026-001" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label for="retailer_details">Retailer Showroom Details</label>
                    <select id="retailer_details" name="retailer_details">
                        <option value="">-Select Showroom-</option>
                        <option value="Partner Store 1">Partner Store 1</option>
                        <option value="Partner Store 2">Partner Store 2</option>
                    </select>
                </div>
                <div class="form-col">
                    <label for="retailer_code">Retailer Code</label>
                    <input type="text" id="retailer_code" name="retailer_code" placeholder="Enter Retailer Code">
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label for="customer_photo">Customer Photo *</label>
                    <input type="file" id="customer_photo" name="customer_photo" accept="image/*" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col" style="flex: 0.3;">
                    <label for="prefix">Prefix</label>
                    <select id="prefix" name="prefix">
                        <option value="Mr">Mr</option>
                        <option value="Mrs">Mrs</option>
                        <option value="Ms">Ms</option>
                    </select>
                </div>
                <div class="form-col">
                    <label for="first_name">First Name *</label>
                    <input type="text" id="first_name" name="first_name" required>
                </div>
                <div class="form-col">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name">
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label for="relationship">Relationship *</label>
                    <select id="relationship" name="relationship" required>
                        <option value="">-Select-</option>
                        <option value="Son">Son of</option>
                        <option value="Daughter">Daughter of</option>
                        <option value="Spouse">Spouse of</option>
                    </select>
                </div>
                <div class="form-col">
                    <label for="rel_name">Relative Name *</label>
                    <input type="text" id="rel_name" name="rel_name" required>
                </div>
            </div>
        </fieldset>

        <!-- Personal & Contact Info -->
        <fieldset>
            <legend>Personal & Contact Info</legend>
            
            <div class="form-row">
                <div class="form-col">
                    <label for="loan_date">Application Date *</label>
                    <input type="date" id="loan_date" name="loan_date" required>
                </div>
                <div class="form-col">
                    <label for="id_number">ID Number (PAN / Aadhaar) *</label>
                    <input type="text" id="id_number" name="id_number" placeholder="Enter ID Number" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label for="address">Address Line 1 *</label>
                    <input type="text" id="address" name="address" placeholder="Door No, Street Name" required>
                </div>
                <div class="form-col">
                    <label for="landmark">Landmark</label>
                    <input type="text" id="landmark" name="landmark" placeholder="Near Temple / School">
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label for="city">City / District *</label>
                    <input type="text" id="city" name="city" required>
                </div>
                <div class="form-col">
                    <label for="state">State *</label>
                    <input type="text" id="state" name="state" value="Tamil Nadu" required>
                </div>
                <div class="form-col">
                    <label for="postal_code">Postal Code *</label>
                    <input type="text" id="postal_code" name="postal_code" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label for="phone_number">Phone Number *</label>
                    <input type="tel" id="phone_number" name="phone_number" placeholder="10-digit mobile number" required>
                </div>
                <div class="form-col">
                    <label for="whatsapp_number">WhatsApp Number *</label>
                    <input type="tel" id="whatsapp_number" name="whatsapp_number" placeholder="WhatsApp number" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label for="nominee_name">Nominee Name *</label>
                    <input type="text" id="nominee_name" name="nominee_name" required>
                </div>
                <div class="form-col">
                    <label for="nominee_contact">Nominee Contact Number *</label>
                    <input type="tel" id="nominee_contact" name="nominee_contact" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label for="occupation">Occupation *</label>
                    <select id="occupation" name="occupation" required>
                        <option value="">-Select Occupation-</option>
                        <option value="Salaried">Salaried</option>
                        <option value="Business">Business</option>
                        <option value="Self-Employed">Self-Employed</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
                <div class="form-col">
                    <label for="nature_of_job">Nature of Job / Business *</label>
                    <input type="text" id="nature_of_job" name="nature_of_job" required>
                </div>
            </div>
        </fieldset>

        <!-- Loan & Product Financing Info -->
        <fieldset>
            <legend>Loan Product & Repayment Structure</legend>
            
            <div class="form-row">
                <div class="form-col">
                    <label for="loan_type">Select Loan / Finance Type *</label>
                    <select id="loan_type" name="loan_type" required>
                        <option value="">-Select Type-</option>
                        <option value="Personal Loan - Daily">Personal Loan (Daily Repayment)</option>
                        <option value="Personal Loan - Weekly">Personal Loan (Weekly Repayment)</option>
                        <option value="Mobiles - Weekly">Mobile Phone Finance (Weekly EMI)</option>
                        <option value="Furniture - Weekly">Furniture Finance (Weekly EMI)</option>
                        <option value="Home Appliances - Weekly">Home Appliances Finance (Weekly EMI)</option>
                    </select>
                </div>
                <div class="form-col">
                    <label for="payment_method">Payment Method *</label>
                    <select id="payment_method" name="payment_method" required>
                        <option value="">-Select-</option>
                        <option value="Cash">Cash Collection</option>
                        <option value="Online / UPI">Online / UPI</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label for="cibil_score">Verification / CIBIL Status *</label>
                    <input type="text" id="cibil_score" name="cibil_score" placeholder="Verified / Score" required>
                </div>
                <div class="form-col">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label for="doc_front">Upload Front Document (Aadhaar/PAN) *</label>
                    <input type="file" id="doc_front" name="doc_front" required>
                </div>
                <div class="form-col">
                    <label for="doc_back">Upload Back Document *</label>
                    <input type="file" id="doc_back" name="doc_back" required>
                </div>
            </div>
        </fieldset>

        <button type="submit" class="submit-btn">Submit Borrower Application</button>
    </form>
</div>

</body>
</html>
